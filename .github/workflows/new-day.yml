name: RAROG New Day

on:
  schedule:
    - cron: "5 0 * * *"
      timezone: "Europe/Kyiv"
  workflow_dispatch:

jobs:
  new-day:
    runs-on: ubuntu-latest

    steps:
      - name: Start new day
        env:
          WEBAPP_URL: ${{ secrets.RAROG_WEBAPP_URL }}
          SECRET_BODY: ${{ secrets.RAROG_SCHEDULER_BODY }}

        run: |
          CLEAN_URL="$(printf '%s' "$WEBAPP_URL" | tr -d '\r\n' | xargs)"

          if [[ -z "$CLEAN_URL" ]]; then
            echo "Помилка: RAROG_WEBAPP_URL порожній."
            exit 1
          fi

          if [[ ! "$CLEAN_URL" =~ ^https://script\.google\.com/macros/s/.+/exec$ ]]; then
            echo "Помилка: неправильний URL Apps Script."
            exit 1
          fi

          REQUEST_BODY="$(printf '%s' "$SECRET_BODY" | jq -c '. + {action:"newDay"}')"

          curl \
            --location \
            --fail-with-body \
            --silent \
            --show-error \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY" \
            --output response.txt \
            "$CLEAN_URL"

          echo "Відповідь Apps Script:"
          cat response.txt
          echo ""

          if grep -q '"newDayStarted":true' response.txt; then
            echo "Нову добу успішно розпочато."
            exit 0
          fi

          if grep -q '"reason":"already_started"' response.txt; then
            echo "Нова доба вже була розпочата раніше."
            exit 0
          fi

          echo "Apps Script не підтвердив початок нової доби."
          exit 1
