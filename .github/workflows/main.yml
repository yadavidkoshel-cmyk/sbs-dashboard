name: Auto Publish Report

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish report
        env:
          WEBAPP_URL: ${{ secrets.RAROG_WEBAPP_URL }}
          REQUEST_BODY: ${{ secrets.RAROG_SCHEDULER_BODY }}

        run: |
          CLEAN_URL="$(printf '%s' "$WEBAPP_URL" | tr -d '\r\n' | xargs)"

          if [[ -z "$CLEAN_URL" ]]; then
            echo "Помилка: RAROG_WEBAPP_URL порожній."
            exit 1
          fi

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output response.txt \
            --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY" \
            "$CLEAN_URL")

          echo "HTTP-код Apps Script: $HTTP_CODE"
          cat response.txt || true

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "302" ]]; then
            echo "Помилка виклику Apps Script."
            exit 1
          fi

          echo "Запит на публікацію успішно передано."
