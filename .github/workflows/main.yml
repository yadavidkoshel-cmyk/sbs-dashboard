name: Auto Publish Report

on:
  schedule:
    - cron: "0 */2 * * *"
      timezone: "Europe/Kyiv"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish report
        env:
          WEBAPP_URL: ${{ secrets.RAROG_WEBAPP_URL }}
          REQUEST_BODY: ${{ secrets.RAROG_SCHEDULER_BODY }}

        run: |
          CLEAN_URL="$(printf '%s' "$WEBAPP_URL" | tr -d '\r\n' | xargs)"

          if [[ -z "$CLEAN_URL" ]]; then
            echo "RAROG_WEBAPP_URL порожній."
            exit 1
          fi

          if [[ ! "$CLEAN_URL" =~ ^https://script\.google\.com/macros/s/.+/exec$ ]]; then
            echo "Неправильний URL Apps Script."
            exit 1
          fi

          curl \
            --location \
            --fail-with-body \
            --show-error \
            --header "Content-Type: application/json" \
            --data "$REQUEST_BODY" \
            --output response.txt \
            "$CLEAN_URL"

          echo "Відповідь Apps Script:"
          cat response.txt

          if ! grep -q '"ok":true' response.txt; then
            echo ""
            echo "Apps Script не підтвердив успішну публікацію."
            exit 1
          fi

          echo ""
          echo "Дані успішно опубліковані."
